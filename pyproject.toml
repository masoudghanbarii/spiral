[project]
name = "spiral"
version = "0.1.0"
description = "AI Co-founder powered by hill climbing loop architecture"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
spiral = "src.spiral.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spiral*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/spiral"]

[tool.coverage.report]
fail_under = 80
